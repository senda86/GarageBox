name: Aggiorna prezzi carburante
on:
  schedule:
    - cron: '30 21 * * *'
    - cron: '30 5 * * *'
    - cron: '30 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_prices.py
      - run: |
          git config user.name "prezzi-bot"
          git config user.email "bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "Aggiorna prezzi" && git push)
