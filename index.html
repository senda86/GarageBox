<style>
/* Layout: phone-first app shell, scrolling content column, fixed bottom tab bar, bottom sheets for forms */
:root{--bg:#0c0e0d;--surface:#151917;--surface2:#1d2220;--line:#2a312e;--fg:#eef2ef;--muted:#8e9a94;--accent:#b8f23a;--accent-ink:#0c1100;--warn:#f5a524;--bad:#ff6b6b;--ok:#4ade80;--shade:rgba(0,0,0,.6);--fd:'Space Grotesk',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f5f2;--surface:#fff;--surface2:#e9ede8;--line:#d6ddd6;--fg:#121614;--muted:#596660;--accent:#4d7c0f;--accent-ink:#fff;--warn:#b45309;--bad:#c62828;--ok:#15803d;--shade:rgba(0,0,0,.4);color-scheme:light}}
:root[data-theme="light"]{--bg:#f3f5f2;--surface:#fff;--surface2:#e9ede8;--line:#d6ddd6;--fg:#121614;--muted:#596660;--accent:#4d7c0f;--accent-ink:#fff;--warn:#b45309;--bad:#c62828;--ok:#15803d;--shade:rgba(0,0,0,.4);color-scheme:light}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--fb);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:18px}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance}
h1{font-size:26px;letter-spacing:-.01em}h2{font-size:18px}h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);font-weight:600;padding:11px 16px;border-radius:12px;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--surface2);display:grid;place-items:center}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pad{padding:14px}
.vcard{display:block;width:100%;text-align:left;position:relative;min-height:170px;color:#fff;background:#1d2220 center/cover}
.vcard .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 25%,rgba(0,0,0,.82))}
.vcard .info{position:absolute;left:0;right:0;bottom:0;padding:14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.vcard .nm{font:700 20px var(--fd)}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--surface2);white-space:nowrap}
.chip.bad{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.chip.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.vcard .chip{background:rgba(0,0,0,.55);color:#fff}
.ph{display:grid;place-items:center;color:var(--muted);height:100%}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .ico{width:38px;height:38px;border-radius:11px;background:var(--surface2);display:grid;place-items:center;flex:none;color:var(--accent)}
.amount{font:600 15px var(--fd);font-variant-numeric:tabular-nums;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font:700 20px var(--fd);font-variant-numeric:tabular-nums;margin-top:2px}
.hero{height:200px;background:var(--surface2) center/cover;border-radius:16px;position:relative;overflow:hidden;color:#fff}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.1) 30%,rgba(0,0,0,.85))}
.hero .info{position:absolute;left:14px;right:14px;bottom:12px}
.hero .nm{font:700 24px var(--fd)}
.seg{display:flex;gap:6px;background:var(--surface2);padding:4px;border-radius:12px}
.seg button{flex:1;min-width:0;font-size:13px;padding:8px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--surface);border-top:1px solid var(--line);padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));z-index:5}
.tabs nav{display:flex;width:100%;max-width:640px;gap:4px}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 2px;border-radius:12px}
.tabs button.on{color:var(--accent)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:4;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.scrim{position:fixed;inset:0;background:var(--shade);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.field input,.field select,.field textarea{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:10px;flex-wrap:wrap}.acts .btn{flex:1}
.empty{text-align:center;padding:34px 18px;display:flex;flex-direction:column;gap:10px;align-items:center}
.section-h{display:flex;justify-content:space-between;align-items:center}
.cover-prev{height:110px;border-radius:12px;background:var(--surface2) center/cover;display:grid;place-items:center;color:var(--muted)}
.lang{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px}
textarea.bk{min-height:90px;font:12px/1.3 ui-monospace,monospace}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}}
</style>

<script>
var KEY='garagebox.v1',mem=null;
var S={v:[],d:[],e:[],s:{lang:'it',cur:'₺',lead:30,theme:'auto',lastN:''}};

function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
load();

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function money(n){return new Intl.NumberFormat(LOCALE[S.s.lang],{maximumFractionDigits:2,minimumFractionDigits:n%1?2:0}).format(n||0)+' '+S.s.cur}

<script>
function vehOpts(sel){return S.v.map(function(v){return '<option value="'+v.id+'"'+(v.id===sel?' selected':'')+'>'+esc(v.name)+'</option>'}).join('')}
function fld(id,label,inner){return '<div class="field"><label for="'+id+'">'+label+'</label>'+inner+'</div>'}
function inp(id,type,val,extra){return '<input id="'+id+'" type="'+type+'" value="'+esc(val==null?'':val)+'" '+(extra||'')+'>'}
function sheetHtml(){var q=R.sheet;if(!q)return '';var h='';
 if(q.k==='veh'){var v=q.id?veh(q.id):{type:'car'};R.photo=R.photo===undefined?v.photo||'':R.photo;R.vtype=v.type;
  h='<h2>'+(q.id?t('edit'):t('addVehicle'))+'</h2><div class="seg" id="f-type"><button type="button" data-a="vtype" data-id="car" class="'+(v.type==='car'?'on':'')+'">'+t('car')+'</button><button type="button" data-a="vtype" data-id="moto" class="'+(v.type==='moto'?'on':'')+'">'+t('moto')+'</button></div>'+
  fld('f-name',t('name'),inp('f-name','text',v.name,'maxlength="40" placeholder="Alfa Giulia"'))+'<div class="two">'+fld('f-make',t('make'),inp('f-make','text',v.make,'maxlength="30"'))+fld('f-model',t('model'),inp('f-model','text',v.model,'maxlength="30"'))+'</div><div class="two">'+fld('f-year',t('year'),inp('f-year','number',v.year,'inputmode="numeric"'))+fld('f-plate',t('plate'),inp('f-plate','text',v.plate,'maxlength="14"'))+'</div>'+fld('f-km',t('km'),inp('f-km','number',v.km,'inputmode="numeric" min="0"'))+fld('f-fuelv',t('fuelType'),'<select id="f-fuelv">'+FT.map(function(x){return '<option value="'+x+'"'+(x===(v.fuel||'benzin')?' selected':'')+'>'+t(x)+'</option>'}).join('')+'</select>')+
  '<div class="field"><label for="f-photo">'+t('cover')+'</label><div class="cover-prev" id="f-prev"'+(R.photo?' style="background-image:url('+R.photo+')"':'')+'>'+(R.photo?'':I.img)+'</div><input id="f-photo" type="file" accept="image/*"></div>'+
  '<div class="acts"><button class="btn ghost" data-a="close">'+t('cancel')+'</button><button class="btn" data-a="savev" data-id="'+(q.id||'')+'">'+t('save')+'</button></div>'+(q.id?'<button class="btn danger" data-a="delv" data-id="'+q.id+'">'+(R.arm==='v'+q.id?t('confirm'):t('del'))+'</button>':'')}
 if(q.k==='dl'){var d=q.id?S.d.find(function(x){return x.id===q.id}):{vid:q.vid||R.vid||(S.v[0]&&S.v[0].id),type:'insurance',date:today()};
  h='<h2>'+(q.id?t('edit'):t('addDeadline'))+'</h2>'+fld('f-veh',t('vehicle'),'<select id="f-veh">'+vehOpts(d.vid)+'</select>')+fld('f-type',t('category'),'<select id="f-type">'+DT.map(function(x){return '<option value="'+x+'"'+(x===d.type?' selected':'')+'>'+t(x)+'</option>'}).join('')+'</select>')+'<div class="two">'+fld('f-date',t('date'),inp('f-date','date',d.date))+fld('f-km',t('dueKm'),inp('f-km','number',d.km,'inputmode="numeric" min="0"'))+'</div>'+fld('f-note',t('note'),inp('f-note','text',d.note,'maxlength="60"'))+
  '<div class="acts"><button class="btn ghost" data-a="close">'+t('cancel')+'</button><button class="btn" data-a="saved" data-id="'+(q.id||'')+'">'+t('save')+'</button></div>'+(q.id?'<button class="btn danger" data-a="deld" data-id="'+q.id+'">'+(R.arm==='d'+q.id?t('confirm'):t('del'))+'</button>':'')}
 if(q.k==='en'){var e=q.id?S.e.find(function(x){return x.id===q.id}):{vid:q.vid||R.vid||(S.v[0]&&S.v[0].id),cat:'fuel',date:today()};
  var og=function(g,lbl){return '<optgroup label="'+lbl+'">'+CAT[g].map(function(x){return '<option value="'+x+'"'+(x===e.cat?' selected':'')+'>'+t(x)+'</option>'}).join('')+'</optgroup>'};
  h='<h2>'+(q.id?t('edit'):t('addEntry'))+'</h2>'+fld('f-veh',t('vehicle'),'<select id="f-veh">'+vehOpts(e.vid)+'</select>')+fld('f-cat',t('category'),'<select id="f-cat">'+og('fuel',t('fuel'))+og('maint',t('maintCost'))+og('exp',t('log'))+'</select>')+'<div class="two">'+fld('f-date',t('date'),inp('f-date','date',e.date))+fld('f-cost',(e.cat==='fuel'?t('paid'):t('cost'))+' ('+S.s.cur+')',inp('f-cost','number',e.cost,'inputmode="decimal" step="0.01" min="0"'))+'</div>'+
  '<div id="fuelbox" class="list"'+(e.cat==='fuel'?'':' hidden')+'><div class="two">'+fld('f-fuel',t('fuelType'),'<select id="f-fuel">'+FT.map(function(x){return '<option value="'+x+'"'+(x===(e.fuel||(veh(e.vid)||{}).fuel||'benzin')?' selected':'')+'>'+t(x)+'</option>'}).join('')+'</select>')+fld('f-ppl',t('ppl')+' ('+S.s.cur+')',inp('f-ppl','number',e.ppl||(q.id?'':(lastPpl(e.vid,e.fuel||(veh(e.vid)||{}).fuel)||ref(e.fuel||(veh(e.vid)||{}).fuel||'benzin'))),'inputmode="decimal" step="0.01" min="0"'))+'</div><div class="two">'+fld('f-lit',t('liters'),inp('f-lit','number',e.liters,'inputmode="decimal" step="0.01" min="0"'))+fld('f-km',t('km'),inp('f-km','number',e.km,'inputmode="numeric" min="0"'))+'</div><div class="small muted">'+t('autoL')+'</div></div>'+
  '<div id="kmbox"'+(e.cat==='fuel'?' hidden':'')+'>'+fld('f-km2',t('km'),inp('f-km2','number',e.km,'inputmode="numeric" min="0"'))+'</div>'+
  fld('f-note',t('note'),inp('f-note','text',e.note,'maxlength="60"'))+
  '<div class="acts"><button class="btn ghost" data-a="close">'+t('cancel')+'</button><button class="btn" data-a="savee" data-id="'+(q.id||'')+'">'+t('save')+'</button></div>'+(q.id?'<button class="btn danger" data-a="dele" data-id="'+q.id+'">'+(R.arm==='e'+q.id?t('confirm'):t('del'))+'</button>':'')}
 return '<div class="scrim" data-a="scrim"><div class="sheet" role="dialog" aria-modal="true">'+h+'</div></div>'}
function render(){document.documentElement.lang=S.s.lang;var th=S.s.theme;if(th==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',th);
 var v=R.vid&&veh(R.vid),b=v?vDetail(v):R.tab==='garage'?vGarage():R.tab==='deadlines'?vDeadlines():R.tab==='log'?vLog():vSettings();
 var tb=[['garage','home'],['deadlines','cal'],['log','wal'],['settings','set']].map(function(x){return '<button data-a="tab" data-id="'+x[0]+'" class="'+(!v&&R.tab===x[0]||v&&x[0]==='garage'?'on':'')+'">'+I[x[1]]+t(x[0])+'</button>'}).join('');
 $('app').innerHTML='<div class="wrap">'+b+'</div><div class="tabs"><nav>'+tb+'</nav></div>'+sheetHtml();
 if(R.sheet&&R.sheet.k==='veh')$('f-photo').addEventListener('change',onPhoto)}
function onPhoto(e){var f=e.target.files&&e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);R.photo=c.toDataURL('image/jpeg',.75);var p=$('f-prev');p.style.backgroundImage='url('+R.photo+')';p.innerHTML=''};im.src=r.result};r.readAsDataURL(f)}
function val(i){var x=$(i);return x?x.value.trim():''}
function nv(i){var x=val(i);return x===''?null:+x}
function arm(k,fn){if(R.arm===k){R.arm=null;fn()}else{R.arm=k;render()}}
function notify(msg){try{if('Notification' in window&&Notification.permission==='granted'){new Notification('GarageBox',{body:msg});return true}}catch(e){}return false}
function priceNotify(){if(S.s.seenP===undefined||S.s.seenP===sig())return;var u=FT.filter(function(f){var p=PRICES.prev[f],c=PRICES.cur[f];return p!=null&&c!=null&&p!==c}).map(function(f){var d=PRICES.cur[f]-PRICES.prev[f];return t(f)+' '+(d>0?'+':'')+d.toFixed(2)});if(u.length&&notify(t('priceTitle')+': '+u.join(', '))){S.s.seenP=sig();save()}}
function checkNotify(){priceNotify();var a=alerts();if(a.length&&S.s.lastN!==today()){var v=veh(a[0].d.vid);if(notify(t(a[0].d.type)+(v?' · '+v.name:'')+' — '+(a[0].txt||t('overdue'))+(a.length>1?' (+'+(a.length-1)+')':''))){S.s.lastN=today();save()}}}
document.addEventListener('click',function(ev){var el=ev.target.closest('[data-a]');if(!el)return;var a=el.dataset.a,id=el.dataset.id;
 if(a==='scrim'){if(ev.target!==el)return;R.sheet=null;R.photo=undefined;return render()}
 if(a==='tab'){R.tab=id;R.vid=null;R.fv='all';R.arm=null;window.scrollTo(0,0);return render()}
 if(a==='open'){R.vid=id;R.fv='all';window.scrollTo(0,0);return render()}
 if(a==='back'){R.vid=null;return render()}
 if(a==='fv'){R.fv=id;return render()}
 if(a==='close'){R.sheet=null;R.photo=undefined;R.arm=null;return render()}
 if(a==='newv'){R.photo=undefined;R.sheet={k:'veh'};return render()}
 if(a==='editv'){R.photo=undefined;R.sheet={k:'veh',id:id};return render()}
 if(a==='vtype'){R.vtype=id;[].forEach.call(document.querySelectorAll('#f-type button'),function(b){b.classList.toggle('on',b.dataset.id===id)});return}
 if(a==='newd'){if(!S.v.length){R.tab='garage';R.sheet={k:'veh'};return render()}R.sheet={k:'dl',vid:el.dataset.v};return render()}
 if(a==='dl'){R.sheet={k:'dl',id:id};return render()}
 if(a==='newe'){if(!S.v.length){R.tab='garage';R.sheet={k:'veh'};return render()}R.sheet={k:'en',vid:el.dataset.v};return render()}
 if(a==='en'){R.sheet={k:'en',id:id};return render()}
 if(a==='savev'){var n=val('f-name');if(!n){$('f-name').focus();return}var o=id?veh(id):{id:uid()};
  Object.assign(o,{type:R.vtype||'car',name:n,make:val('f-make'),model:val('f-model'),year:nv('f-year'),plate:val('f-plate').toUpperCase(),km:nv('f-km'),fuel:val('f-fuelv')||'benzin',photo:R.photo||''});if(!id)S.v.push(o);save();R.sheet=null;R.photo=undefined;return render()}
 if(a==='delv')return arm('v'+id,function(){S.v=S.v.filter(function(v){return v.id!==id});S.d=S.d.filter(function(d){return d.vid!==id});S.e=S.e.filter(function(e){return e.vid!==id});R.sheet=null;R.vid=null;save();render()});
 if(a==='saved'){var o2=id?S.d.find(function(x){return x.id===id}):{id:uid()};var dt=val('f-date'),kk=nv('f-km');if(!dt&&kk===null){$('f-date').focus();return}
  Object.assign(o2,{vid:val('f-veh'),type:val('f-type'),date:dt,km:kk,note:val('f-note')});if(!id)S.d.push(o2);save();R.sheet=null;return render()}
 if(a==='deld')return arm('d'+id,function(){S.d=S.d.filter(function(d){return d.id!==id});R.sheet=null;save();render()});
 if(a==='savee'){var o3=id?S.e.find(function(x){return x.id===id}):{id:uid()};var vv=veh(val('f-veh')),isF=val('f-cat')==='fuel',km=isF?nv('f-km'):nv('f-km2');
  Object.assign(o3,{vid:val('f-veh'),cat:val('f-cat'),date:val('f-date')||today(),cost:nv('f-cost')||0,km:km,liters:isF?nv('f-lit'):null,fuel:isF?val('f-fuel'):null,ppl:isF?nv('f-ppl'):null,note:val('f-note')});if(!id)S.e.push(o3);if(vv&&km!==null&&(vv.km==null||km>vv.km))vv.km=km;save();R.sheet=null;return render()}
 if(a==='dele')return arm('e'+id,function(){S.e=S.e.filter(function(e){return e.id!==id});R.sheet=null;save();render()});
 if(a==='pseen'){S.s.seenP=sig();save();return render()}
 if(a==='prefresh'){var pp=loadPrices(true);if(pp)pp.then(checkNotify);return}
 if(a==='install'){if(R.dip){R.dip.prompt();R.dip=null;render()}return}
 if(a==='non'){try{Notification.requestPermission().then(function(){render();checkNotify()},function(){render()})}catch(e){render()}return}
 if(a==='ntest'){notify(t('upcoming'));return}
 if(a==='bcopy'){var js=JSON.stringify(S),m=$('bmsg');var ok=function(){m.textContent=t('copied')};try{navigator.clipboard.writeText(js).then(ok,function(){var x=$('bk');x.value=js;x.select()})}catch(e){var x=$('bk');x.value=js;x.select()}return}
 if(a==='brest'){try{var o4=JSON.parse($('bk').value);if(!Array.isArray(o4.v)||!Array.isArray(o4.d)||!Array.isArray(o4.e))throw 0;S=o4;S.s=Object.assign({lang:'it',cur:'₺',lead:30,theme:'auto',lastN:''},o4.s||{});save();R.tab='garage';render()}catch(e){$('bmsg').textContent=t('bad')}return}
 if(a==='wipe')return arm('wipe',function(){S={v:[],d:[],e:[],s:S.s};save();R.tab='garage';render()})});
function calc(src){var c=nv('f-cost'),p=nv('f-ppl'),l=nv('f-lit');
 if(src==='lit'){if(c&&l)$('f-ppl').value=(c/l).toFixed(2)}else if(c&&p)$('f-lit').value=(c/p).toFixed(2)}
document.addEventListener('input',function(ev){var i=ev.target.id;if(i==='f-cost'||i==='f-ppl')calc('cp');else if(i==='f-lit')calc('lit')});
document.addEventListener('change',function(ev){var i=ev.target.id;
 if(i==='f-cat'){var f=ev.target.value==='fuel';$('fuelbox').hidden=!f;$('kmbox').hidden=f;var km=f?$('f-km2').value:$('f-km').value;(f?$('f-km'):$('f-km2')).value=km;return}
 if(i==='f-fuel'){var v=veh(val('f-veh'));$('f-ppl').value=(lastPpl(v&&v.id,ev.target.value)||ref(ev.target.value));calc('cp');return}
 if(i==='f-veh'&&$('f-fuel')){var v2=veh(ev.target.value);if(v2&&v2.fuel){$('f-fuel').value=v2.fuel;$('f-ppl').value=(lastPpl(v2.id,v2.fuel)||ref(v2.fuel));calc('cp')}return}
var k=ev.target.dataset&&ev.target.dataset.set;if(!k)return;S.s[k]=k==='lead'?+ev.target.value:ev.target.value;save();render()});
document.documentElement.lang=S.s.lang;
if(S.s.pc&&S.s.pc.asof>=PRICES.asof)applyPrices(S.s.pc);
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();R.dip=e;if(!R.sheet&&R.tab==='settings'&&!R.vid)render()});
render();checkNotify();
(function(){var p=loadPrices();if(p)p.then(checkNotify)})();
document.addEventListener('visibilitychange',function(){if(!document.hidden){var p=loadPrices();if(p)p.then(checkNotify)}});
try{if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
</script>
</body></html>
